<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Descubra Sua Profissão</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      background: linear-gradient(135deg,#0f172a,#1e293b);
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
      color:white;
    }

    .chat-container{
      width:100%;
      max-width:700px;
      background:#111827;
      border-radius:20px;
      overflow:hidden;
      box-shadow:0 0 30px rgba(0,0,0,0.4);
    }

    .topo{
      background:#16a34a;
      padding:20px;
      text-align:center;
    }

    .topo h1{
      font-size:28px;
    }

    .topo p{
      margin-top:8px;
      opacity:0.9;
    }

    .chat{
      padding:25px;
      min-height:450px;
    }

    .pergunta{
      font-size:22px;
      margin-bottom:25px;
      line-height:1.4;
    }

    .opcoes{
      display:flex;
      flex-direction:column;
      gap:15px;
    }

    button{
      background:#1f2937;
      color:white;
      border:none;
      padding:16px;
      border-radius:12px;
      cursor:pointer;
      transition:0.3s;
      font-size:16px;
      text-align:left;
    }

    button:hover{
      background:#16a34a;
      transform:translateY(-2px);
    }

    .resultado{
      text-align:center;
      animation: aparecer 0.5s ease;
    }

    .resultado h2{
      font-size:32px;
      margin-bottom:15px;
      color:#22c55e;
    }

    .resultado p{
      font-size:18px;
      line-height:1.6;
      margin-bottom:20px;
    }

    .profissoes{
      background:#1f2937;
      padding:18px;
      border-radius:12px;
      margin-top:15px;
    }

    .reiniciar{
      margin-top:25px;
      background:#22c55e;
      text-align:center;
    }

    @keyframes aparecer{
      from{
        opacity:0;
        transform:translateY(20px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    .progresso{
      width:100%;
      height:8px;
      background:#374151;
    }

    .barra{
      height:100%;
      width:0%;
      background:#22c55e;
      transition:0.3s;
    }
  </style>
</head>
<body>

  <div class="chat-container">

    <div class="topo">
      <h1>Descubra Sua Profissão</h1>
      <p>Responda o quiz e descubra qual área combina com você!</p>
    </div>

    <div class="progresso">
      <div class="barra" id="barra"></div>
    </div>

    <div class="chat" id="chat">
    </div>

  </div>

<script>

const perguntas = [
  {
    pergunta: "1. O que você mais gosta de fazer?",
    opcoes: [
      { texto: "Criar tecnologias e resolver problemas", area: "tecnologia" },
      { texto: "Ajudar pessoas", area: "saude" },
      { texto: "Desenhar, criar ou editar", area: "artes" },
      { texto: "Liderar projetos e negócios", area: "negocios" }
    ]
  },

  {
    pergunta: "2. Qual matéria você prefere?",
    opcoes: [
      { texto: "Matemática", area: "engenharia" },
      { texto: "Biologia", area: "saude" },
      { texto: "Artes", area: "artes" },
      { texto: "Informática", area: "tecnologia" }
    ]
  },

  {
    pergunta: "3. Em grupo você costuma ser quem...",
    opcoes: [
      { texto: "Organiza tudo", area: "negocios" },
      { texto: "Tem ideias criativas", area: "artes" },
      { texto: "Resolve os problemas", area: "engenharia" },
      { texto: "Cuida das pessoas", area: "saude" }
    ]
  },

  {
    pergunta: "4. Qual ambiente parece mais interessante?",
    opcoes: [
      { texto: "Laboratório", area: "saude" },
      { texto: "Empresa", area: "negocios" },
      { texto: "Estúdio criativo", area: "artes" },
      { texto: "Empresa de tecnologia", area: "tecnologia" }
    ]
  },

  {
    pergunta: "5. Você prefere...",
    opcoes: [
      { texto: "Programar sistemas", area: "tecnologia" },
      { texto: "Projetar construções", area: "engenharia" },
      { texto: "Criar conteúdos", area: "artes" },
      { texto: "Empreender", area: "negocios" }
    ]
  },

  {
    pergunta: "6. Qual dessas atividades parece mais divertida?",
    opcoes: [
      { texto: "Montar robôs", area: "engenharia" },
      { texto: "Editar vídeos", area: "artes" },
      { texto: "Atender pessoas", area: "saude" },
      { texto: "Criar aplicativos", area: "tecnologia" }
    ]
  },

  {
    pergunta: "7. Você se considera mais...",
    opcoes: [
      { texto: "Criativo(a)", area: "artes" },
      { texto: "Analítico(a)", area: "engenharia" },
      { texto: "Comunicativo(a)", area: "negocios" },
      { texto: "Cuidadoso(a)", area: "saude" }
    ]
  },

  {
    pergunta: "8. Qual objetivo parece mais interessante?",
    opcoes: [
      { texto: "Criar novas tecnologias", area: "tecnologia" },
      { texto: "Salvar vidas", area: "saude" },
      { texto: "Construir grandes projetos", area: "engenharia" },
      { texto: "Criar marcas famosas", area: "negocios" }
    ]
  },

  {
    pergunta: "9. Você gostaria de trabalhar com...",
    opcoes: [
      { texto: "Computadores", area: "tecnologia" },
      { texto: "Hospitais", area: "saude" },
      { texto: "Empresas e marketing", area: "negocios" },
      { texto: "Design e mídia", area: "artes" }
    ]
  },

  {
    pergunta: "10. Qual profissão chama mais atenção?",
    opcoes: [
      { texto: "Programador(a)", area: "tecnologia" },
      { texto: "Médico(a)", area: "saude" },
      { texto: "Arquiteto(a)", area: "engenharia" },
      { texto: "Designer", area: "artes" }
    ]
  }
];

const resultados = {
  tecnologia: {
    titulo: "Tecnologia",
    texto: "Você gosta de inovação, lógica e tecnologia!",
    profissoes: "Programador • Desenvolvedor de Jogos • Cientista de Dados • Analista de Sistemas"
  },

  saude: {
    titulo: "Saúde",
    texto: "Você demonstra interesse em cuidar das pessoas e ajudar a sociedade.",
    profissoes: "Médico • Enfermeiro • Psicólogo • Fisioterapeuta"
  },

  artes: {
    titulo: "Artes & Design",
    texto: "Sua criatividade é um grande destaque!",
    profissoes: "Designer • Editor de Vídeo • Fotógrafo • Publicitário"
  },

  engenharia: {
    titulo: "Engenharia",
    texto: "Você gosta de resolver problemas e criar soluções.",
    profissoes: "Engenheiro Civil • Engenheiro Mecânico • Arquiteto • Engenheiro de Software"
  },

  negocios: {
    titulo: "Negócios & Administração",
    texto: "Você possui perfil de liderança e comunicação.",
    profissoes: "Administrador • Empresário • Profissional de Marketing • Gestor Financeiro"
  }
};

let perguntaAtual = 0;

let pontos = {
  tecnologia: 0,
  saude: 0,
  artes: 0,
  engenharia: 0,
  negocios: 0
};

const chat = document.getElementById("chat");
const barra = document.getElementById("barra");

function mostrarPergunta(){

  let p = perguntas[perguntaAtual];

  barra.style.width = ((perguntaAtual) / perguntas.length) * 100 + "%";

  chat.innerHTML = `
    <div class="pergunta">${p.pergunta}</div>

    <div class="opcoes">
      ${p.opcoes.map(opcao => `
        <button onclick="responder('${opcao.area}')">
          ${opcao.texto}
        </button>
      `).join("")}
    </div>
  `;
}

function responder(area){

  pontos[area]++;

  perguntaAtual++;

  if(perguntaAtual < perguntas.length){
    mostrarPergunta();
  }else{
    mostrarResultado();
  }
}

function mostrarResultado(){

  barra.style.width = "100%";

  let maior = "";
  let maiorPonto = 0;

  for(let area in pontos){
    if(pontos[area] > maiorPonto){
      maiorPonto = pontos[area];
      maior = area;
    }
  }

  let resultado = resultados[maior];

  chat.innerHTML = `
    <div class="resultado">

      <h2>${resultado.titulo}</h2>

      <p>${resultado.texto}</p>

      <div class="profissoes">
        <strong>Profissões indicadas:</strong><br><br>
        ${resultado.profissoes}
      </div>

      <button class="reiniciar" onclick="reiniciarQuiz()">
        Refazer Quiz
      </button>

    </div>
  `;
}

function reiniciarQuiz(){

  perguntaAtual = 0;

  pontos = {
    tecnologia: 0,
    saude: 0,
    artes: 0,
    engenharia: 0,
    negocios: 0
  };

  mostrarPergunta();
}

mostrarPergunta();

</script>

</body>
</html>
